<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Connexion - Nexora</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="logo">Nexora</div>
    <nav>
        <a href="/">Accueil</a>

</header>

<main class="form-page">

        <p>Pas encore de compte ? <a href="/register">S’inscrire</a></p>
    </form>

</body>
</html>
